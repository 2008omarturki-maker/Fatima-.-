<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>كون فاطمة 🌌❤️</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  overflow:hidden;
  font-family:Arial,Tahoma,sans-serif;
  background:#02030d;
  color:white;
}

.space{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;

  background:
  radial-gradient(
    circle at 50% 45%,
    #1c1740 0%,
    #090b25 38%,
    #02030d 78%
  );
}

/* القمر الواحد */

.moon{
  position:absolute;
  top:55px;
  right:30px;
  font-size:65px;
  z-index:3;

  filter:
  drop-shadow(
    0 0 25px
    rgba(255,255,220,.9)
  );

  animation:
  moonFloat 4s ease-in-out infinite;
}

@keyframes moonFloat{
  0%,100%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-10px);
  }
}

/* النجوم */

.star{
  position:absolute;
  z-index:4;

  font-size:18px;

  cursor:pointer;

  user-select:none;

  transition:
  transform .25s,
  filter .25s;

  animation:
  twinkle 2s ease-in-out infinite;
}

.star:hover{
  transform:scale(1.8);
  filter:
  drop-shadow(
    0 0 12px white
  );
}

@keyframes twinkle{

  0%,100%{
    opacity:.35;
  }

  50%{
    opacity:1;
  }
}

/* العنوان */

.title{
  position:absolute;
  top:50px;
  left:50%;
  transform:translateX(-50%);

  width:90%;

  text-align:center;

  z-index:5;

  font-size:25px;

  text-shadow:
  0 0 15px
  rgba(255,255,255,.5);
}

.title span{
  color:#ff9dbc;
}

/* الرسالة */

.message{
  position:absolute;

  top:50%;
  left:50%;

  width:88%;
  max-width:450px;

  transform:
  translate(-50%,-50%)
  scale(.7);

  opacity:0;

  padding:30px 20px;

  text-align:center;

  border-radius:30px;

  background:
  rgba(10,8,30,.78);

  border:
  1px solid
  rgba(255,255,255,.18);

  backdrop-filter:blur(15px);

  z-index:20;

  pointer-events:none;

  transition:
  .4s ease;
}

.message.show{
  opacity:1;

  transform:
  translate(-50%,-50%)
  scale(1);

  pointer-events:auto;
}

.message .heart{
  font-size:55px;

  animation:
  heartbeat 1.2s infinite;
}

@keyframes heartbeat{
  0%,100%{
    transform:scale(1);
  }

  50%{
    transform:scale(1.15);
  }
}

.message h2{
  margin:15px 0;

  color:#ffb1c9;

  font-size:27px;
}

.message p{
  font-size:19px;
  line-height:2;
}

.close{
  margin-top:20px;

  padding:12px 30px;

  border:0;
  border-radius:30px;

  color:white;

  background:
  linear-gradient(
    135deg,
    #ff4f83,
    #a90045
  );

  font-size:16px;
}

/* النهاية */

.final{
  position:absolute;

  inset:0;

  z-index:50;

  display:flex;

  align-items:center;
  justify-content:center;

  text-align:center;

  padding:25px;

  background:
  radial-gradient(
    circle,
    rgba(31,19,69,.97),
    rgba(2,3,13,.99)
  );

  opacity:0;

  pointer-events:none;

  transition:
  opacity 1s ease;
}

.final.show{
  opacity:1;
  pointer-events:auto;
}

.finalBox{
  max-width:500px;
}

.finalBox .bigHeart{
  font-size:85px;

  animation:
  heartbeat 1.3s infinite;
}

.finalBox h1{
  font-size:40px;

  color:#ffb0c9;

  margin:15px 0;
}

.finalBox p{
  font-size:22px;

  line-height:2;
}

.finalBox strong{
  color:#ff759d;
}

/* قلوب النهاية */

.fallingHeart{
  position:fixed;

  top:-50px;

  z-index:100;

  pointer-events:none;

  animation:
  fall 5s linear forwards;
}

@keyframes fall{

  to{
    transform:
    translateY(110vh)
    rotate(360deg);

    opacity:0;
  }

}

</style>
</head>

<body>

<div class="space" id="space">

  <div class="title">
    🌌 اضغطي على النجوم يا
    <span>فطومتي</span>
    ❤️
  </div>

  <!-- القمر الواحد -->
  <div class="moon">
    🌙
  </div>

  <!-- النجوم تتولد هنا -->
  <div id="stars"></div>


  <!-- الرسالة -->
  <div class="message" id="message">

    <div class="heart">
      ❤️
    </div>

    <h2 id="messageTitle">
      فطومتي
    </h2>

    <p id="messageText">
    </p>

    <button
      class="close"
      onclick="closeMessage()"
    >
      كملي استكشاف 🌌
    </button>

  </div>


  <!-- النهاية -->

  <div class="final" id="final">

    <div class="finalBox">

      <div class="bigHeart">
        ❤️
      </div>

      <h1>
        فاطمة
      </h1>

      <p>

        النجوم كثيرة...
        <br>

        والقمر واحد...
        <br><br>

        لكن
        <strong>
          فطومتي وحدة بقلبي
        </strong>
        ❤️

        <br><br>

        أحبك يا حياتي 🥹❤️

      </p>

    </div>

  </div>

</div>


<script>

/* رسائل النجوم */

const messages=[

  "أحب ضحكتك أكثر مما تتخيلين 😂❤️",

  "صوتك من الأشياء اللي ما أمل منها أبدًا 🥹💕",

  "حتى لو تكلمنا كل يوم، أشتاق لك ❤️",

  "فطومتي، وجودك بحياتي يعني لي كثير 🌷",

  "ما قد حبيت أحد بالطريقة اللي حبيتك فيها ❤️",

  "أبيك دايم مرتاحة ومبسوطة يا حياتي 🫂",

  "لو كان الشوق ينشاف، كان عرفتي قد إيش أشتاق لك 🥺",

  "أنتِ مو شخص عادي بالنسبة لي... أنتِ كل شيء ❤️",

  "فطومتي، أحبك بكل ذرة في الأرض 🌎❤️",

  "أجمل شيء في يومي لما أشوف منك رسالة 🥹",

  "حتى سكوتك له مكان بقلبي ❤️",

  "ودي أكون سبب ابتسامتك كل يوم 🌹"

];


/* إنشاء النجوم */

const starsContainer=
document.getElementById("stars");

for(let i=0;i<70;i++){

  const star=
  document.createElement("div");

  star.className="star";

  star.innerText=
  Math.random()>0.5
  ? "⭐"
  : "✨";

  star.style.left=
  Math.random()*96+"%";

  star.style.top=
  (10+Math.random()*80)+"%";

  star.style.fontSize=
  (8+Math.random()*14)+"px";

  star.style.animationDelay=
  Math.random()*2+"s";

  star.dataset.message=
  messages[
    Math.floor(
      Math.random()*messages.length
    )
  ];

  star.onclick=function(){

    showMessage(
      this.dataset.message
    );

    this.style.transform=
    "scale(2)";

    setTimeout(()=>{

      this.style.transform=
      "";

    },300);

  };

  starsContainer.appendChild(star);

}


/* عرض الرسالة */

function showMessage(text){

  document
  .getElementById("messageText")
  .innerText=text;

  document
  .getElementById("message")
  .classList
  .add("show");

}


/* إغلاق الرسالة */

function closeMessage(){

  document
  .getElementById("message")
  .classList
  .remove("show");

}


/* بعد الضغط على النجوم */

let clickedStars=0;

document
.getElementById("stars")
.addEventListener(
  "click",
  function(e){

    if(
      e.target.classList
      .contains("star")
    ){

      clickedStars++;

      if(clickedStars>=12){

        setTimeout(
          showFinal,
          500
        );

      }

    }

  }
);


/* النهاية */

function showFinal(){

  document
  .getElementById("final")
  .classList
  .add("show");

  heartRain();

}


/* مطر القلوب */

function heartRain(){

  for(
    let i=0;
    i<120;
    i++
  ){

    setTimeout(()=>{

      const heart=
      document.createElement("div");

      heart.className=
      "fallingHeart";

      heart.innerText=
      [
        "❤️",
        "💖",
        "💕",
        "💗"
      ][
        Math.floor(
          Math.random()*4
        )
      ];

      heart.style.left=
      Math.random()*100+"vw";

      heart.style.fontSize=
      (15+Math.random()*30)+"px";

      heart.style.animationDuration=
      (3+Math.random()*4)+"s";

      document.body.appendChild(
        heart
      );

      setTimeout(()=>{

        heart.remove();

      },8000);

    },i*35);

  }

}

</script>

</body>
</html>
