<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>لفطومتي ❤️</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#fff0f4,#ffdce6);
    font-family:Arial,Tahoma,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    color:#43232c;
}

.card{
    width:92%;
    max-width:430px;
    min-height:620px;
    padding:30px 23px;
    border-radius:32px;
    background:rgba(255,255,255,.93);
    box-shadow:0 20px 60px rgba(80,20,40,.2);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    animation:appear .7s ease;
}

@keyframes appear{
    from{
        opacity:0;
        transform:scale(.85) translateY(20px);
    }
    to{
        opacity:1;
        transform:scale(1) translateY(0);
    }
}

.emoji{
    font-size:75px;
    margin-bottom:20px;
    animation:float 2s ease-in-out infinite;
}

@keyframes float{
    50%{transform:translateY(-8px)}
}

h1{
    font-size:31px;
    margin-bottom:18px;
}

p{
    font-size:19px;
    line-height:2;
    margin-bottom:25px;
}

button{
    border:none;
    border-radius:50px;
    padding:16px 28px;
    font-size:18px;
    font-weight:bold;
    color:white;
    background:#e94f72;
    box-shadow:0 8px 25px rgba(233,79,114,.3);
    cursor:pointer;
    transition:.2s;
}

button:active{
    transform:scale(.92);
}

.note{
    margin-top:18px;
    font-size:14px;
    opacity:.55;
}

.bigHeart{
    font-size:70px;
    animation:heartbeat 1.1s infinite;
}

@keyframes heartbeat{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.15)}
}

.box{
    background:#fff6f8;
    border:1px solid #ffd0da;
    padding:20px;
    border-radius:22px;
    width:100%;
    margin-bottom:22px;
}

.red{
    color:#e94f72;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="card" id="card">

    <div class="emoji">🥺❤️</div>

    <h1>فطومتي...</h1>

    <p>
        عندي شيء أبي أقوله لك،
        بس تكفين لا تستعجلين بالحكم علي 😭
    </p>

    <button onclick="next()">وش عندك؟ 👀</button>

    <div class="note">من عمر ❤️</div>

</div>

<script>

let step = 0;

function next(){

    step++;

    const card = document.getElementById("card");

    if(step === 1){

        card.innerHTML = `
            <div class="emoji">🤨</div>

            <h1>اسمعي...</h1>

            <p>
                أنا يوم قلت لك:
                <br><br>
                <span class="red">"صوتك تغيّر..."</span>
            </p>

            <button onclick="next()">وبعدين؟ 😭</button>
        `;

    }

    else if(step === 2){

        card.innerHTML = `
            <div class="emoji">😳</div>

            <h1>لحظة لحظة!</h1>

            <p>
                لا تحكمين علي من أول جملة 😂
                <br><br>
                <b>ما خلصت كلامي أصلاً 😭</b>
            </p>

            <button onclick="next()">كمّل 😂</button>
        `;

    }

    else if(step === 3){

        card.innerHTML = `
            <div class="emoji">🥹❤️</div>

            <h1>كنت أبي أقول...</h1>

            <div class="box">
                <p>
                    "صوتك تغيّر...
                    <br>
                    <b>ما عاد حلو..."</b>
                </p>
            </div>

            <button onclick="next()">وبعدين؟ 👀</button>
        `;

    }

    else if(step === 4){

        card.innerHTML = `
            <div class="bigHeart">❤️</div>

            <h1>الحين صار يخبل 😭</h1>

            <p>
                هذا هو الكلام اللي كنت أبي أوصله لك 😂❤️
                <br><br>
                بس أنتِ ما عطيتيني مجال أكمل 😭
            </p>

            <button onclick="next()">آخر شيء لفطومتي ❤️</button>
        `;

    }

    else if(step === 5){

        card.innerHTML = `
            <div class="emoji">🫂❤️</div>

            <h1>فطومتي يا حياتي</h1>

            <p>
                والله ما كان قصدي أجرحك أو أقول إن صوتك مو حلو.
                <br><br>
                بالعكس...
                <br>
                <b>صوتك من الأشياء اللي أحب أسمعها منك ❤️</b>
            </p>

            <button onclick="next()">كمّل 🥺</button>
        `;

    }

    else if(step === 6){

        card.innerHTML = `
            <div class="emoji">🥺</div>

            <h1>سامحيني؟</h1>

            <p>
                يمكن المزحة ما وصلت مثل ما كنت أبي،
                وأنا آسف إذا ضايقتك.
                <br><br>
                ما أبيك تزعلين مني يا فطومتي.
            </p>

            <button onclick="next()">❤️</button>
        `;

    }

    else{

        card.innerHTML = `
            <div class="bigHeart">❤️</div>

            <h1>وهذي الحقيقة</h1>

            <p>
                صوتك حلو...
                <br>
                وضحكتك أحلى...
                <br>
                وفطومتي كلها على بعضها تخبل 😭❤️
            </p>

            <p>
                <b>أحبك يا فطومتي 🫂❤️</b>
            </p>
        `;
    }

}

</script>

</body>
</html>
