<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>آلة حظ فطومتي ❤️</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  overflow:hidden;

  font-family:
  Arial,
  Tahoma,
  sans-serif;

  color:white;

  background:
  radial-gradient(
    circle at 50% 20%,
    #632044,
    #19091a 50%,
    #050407
  );
}

.container{
  width:100%;
  max-width:500px;

  margin:auto;

  min-height:100vh;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:20px;
}

.machine{
  width:100%;

  padding:25px 18px 30px;

  text-align:center;

  border-radius:35px;

  background:
  linear-gradient(
    145deg,
    rgba(255,255,255,.15),
    rgba(255,255,255,.05)
  );

  border:
  1px solid
  rgba(255,255,255,.2);

  box-shadow:
  0 25px 80px
  rgba(0,0,0,.6);

  backdrop-filter:blur(18px);

  animation:
  appear .8s ease;
}

@keyframes appear{

  from{
    opacity:0;
    transform:
    translateY(30px)
    scale(.9);
  }

  to{
    opacity:1;
    transform:
    translateY(0)
    scale(1);
  }

}

.topHeart{
  font-size:65px;

  animation:
  heartbeat 1.3s infinite;
}

@keyframes heartbeat{

  0%,100%{
    transform:scale(1);
  }

  50%{
    transform:scale(1.15);
  }

}

h1{
  margin:10px 0;

  font-size:30px;

  color:#ffd0df;
}

.subtitle{
  font-size:16px;

  line-height:1.8;

  color:#eee;

  margin-bottom:20px;
}


/* آلة الحظ */

.slotMachine{

  padding:18px;

  border-radius:25px;

  background:
  rgba(0,0,0,.3);

  border:
  1px solid
  rgba(255,255,255,.12);

}

.slots{

  display:flex;

  justify-content:center;

  gap:8px;

  margin-bottom:20px;
}

.slot{

  width:80px;
  height:85px;

  display:flex;

  align-items:center;
  justify-content:center;

  font-size:42px;

  border-radius:18px;

  background:
  linear-gradient(
    180deg,
    #fff,
    #ddd
  );

  color:#222;

  box-shadow:
  inset 0 -8px 15px
  rgba(0,0,0,.15);

}

.spin{
  animation:
  spin .12s
  linear infinite;
}

@keyframes spin{

  0%{
    transform:
    translateY(-4px);
  }

  50%{
    transform:
    translateY(4px);
  }

  100%{
    transform:
    translateY(-4px);
  }

}


/* الزر */

.spinButton{

  width:100%;

  padding:17px;

  border:0;

  border-radius:50px;

  color:white;

  font-size:19px;

  font-weight:bold;

  cursor:pointer;

  background:
  linear-gradient(
    135deg,
    #ff4f83,
    #a60043
  );

  box-shadow:
  0 8px 25px
  rgba(255,60,120,.3);

  transition:.2s;
}

.spinButton:active{
  transform:scale(.94);
}

.spinButton:disabled{
  opacity:.6;
}


/* النتيجة */

.result{

  margin-top:20px;

  min-height:80px;

  padding:18px;

  display:flex;

  align-items:center;
  justify-content:center;

  border-radius:22px;

  background:
  rgba(255,255,255,.08);

  font-size:18px;

  line-height:1.9;

  opacity:0;

  transform:
  scale(.8);

  transition:.4s;
}

.result.show{

  opacity:1;

  transform:
  scale(1);

}


/* العداد */

.counter{

  margin-top:15px;

  color:#ffc3d4;

  font-size:14px;
}


/* النهاية */

.final{

  position:fixed;

  inset:0;

  z-index:50;

  display:flex;

  align-items:center;
  justify-content:center;

  padding:25px;

  text-align:center;

  background:
  radial-gradient(
    circle,
    #461936,
    #100711 70%
  );

  opacity:0;

  pointer-events:none;

  transition:
  opacity 1s ease;
}

.final.show{

  opacity:1;

  pointer-events:auto;

}

.finalBox{

  width:100%;
  max-width:450px;

  padding:35px 20px;

  border-radius:35px;

  background:
  rgba(255,255,255,.08);

  border:
  1px solid
  rgba(255,255,255,.15);

  backdrop-filter:blur(15px);

}

.finalHeart{

  font-size:85px;

  animation:
  heartbeat 1.2s infinite;
}

.final h2{

  margin:15px 0;

  font-size:32px;

  color:#ffb4c9;

}

.final p{

  font-size:21px;

  line-height:2;

}

.final strong{

  color:#ff719c;

}

.closeFinal{

  margin-top:25px;

  padding:14px 30px;

  border:0;

  border-radius:40px;

  color:white;

  background:
  linear-gradient(
    135deg,
    #ff477e,
    #a90042
  );

  font-size:16px;
}


/* القلوب */

.heart{

  position:fixed;

  top:-50px;

  z-index:100;

  pointer-events:none;

  animation:
  fall 5s linear forwards;
}

@keyframes fall{

  to{

    transform:
    translateY(110vh)
    rotate(360deg);

    opacity:0;

  }

}


/* اهتزاز الآلة */

.shake{

  animation:
  machineShake .45s ease;
}

@keyframes machineShake{

  0%,100%{
    transform:translateX(0);
  }

  20%{
    transform:translateX(-8px);
  }

  40%{
    transform:translateX(8px);
  }

  60%{
    transform:translateX(-6px);
  }

  80%{
    transform:translateX(6px);
  }

}


/* الجوال */

@media(max-width:400px){

  h1{
    font-size:26px;
  }

  .slot{
    width:72px;
    height:78px;
    font-size:38px;
  }

}
</style>
</head>

<body>


<div class="container">

  <div class="machine" id="machine">

    <div class="topHeart">
      ❤️
    </div>

    <h1>
      آلة حظ فطومتي 🎰
    </h1>

    <div class="subtitle">
      اضغطي الزر وشوفي وش مخبي لك عمر ❤️
    </div>


    <div class="slotMachine">

      <div class="slots">

        <div class="slot" id="slot1">
          ❤️
        </div>

        <div class="slot" id="slot2">
          🌹
        </div>

        <div class="slot" id="slot3">
          💌
        </div>

      </div>


      <button
        class="spinButton"
        id="spinButton"
        onclick="spin()"
      >
        🎰 اضغطي وشوفي المفاجأة
      </button>


      <div
        class="result"
        id="result"
      >
      </div>


      <div class="counter">
        المفاجآت:
        <span id="count">0</span>
        / 5
      </div>

    </div>

  </div>

</div>


<!-- النهاية -->

<div class="final" id="final">

  <div class="finalBox">

    <div class="finalHeart">
      ❤️
    </div>

    <h2>
      آخر مفاجأة يا فطومتي
    </h2>

    <p>

      ما فيه جائزة بالدنيا
      <br>
      أغلى منك عند عمر ❤️

      <br><br>

      <strong>
        أحبك يا حياتي 🥹❤️
      </strong>

    </p>

    <button
      class="closeFinal"
      onclick="closeFinal()"
    >
      أحبك أكثر ❤️
    </button>

  </div>

</div>


<script>


/* الرموز */

const icons=[
  "❤️",
  "💖",
  "💕",
  "🌹",
  "💌",
  "🥹",
  "✨",
  "🎁"
];


/* المفاجآت */

const prizes=[

  "❤️ فطومتي، أحبك أكثر مما تتوقعين.",

  "😂 إذا ضحكتي الحين، عمر يعتبر نفسه فاز.",

  "💌 رسالة من عمر: وجودك بحياتي شيء ما أبي أخسره.",

  "🌹 أنتِ أجمل صدفة وأحلى شخص دخل حياتي.",

  "🥹 حتى لو تكلمنا كل يوم، أشتاق لك.",

  "🎁 هديتك اليوم: ابتسامة منك تكفيني.",

  "💕 فطومتي، أنتِ مو شخص عادي بالنسبة لي.",

  "✨ أحب كل تفاصيلك الصغيرة قبل الكبيرة.",

  "❤️ لو الحظ له اسم، بيكون اسمك فاطمة.",

  "🌙 لو أقدر أعطيك شيء واحد، بعطيك راحة قلبك."

];


let count=0;

let spinning=false;


/* تشغيل الآلة */

function spin(){

  if(spinning){
    return;
  }

  spinning=true;

  const button=
  document.getElementById(
    "spinButton"
  );

  const machine=
  document.getElementById(
    "machine"
  );

  const result=
  document.getElementById(
    "result"
  );

  const slot1=
  document.getElementById(
    "slot1"
  );

  const slot2=
  document.getElementById(
    "slot2"
  );

  const slot3=
  document.getElementById(
    "slot3"
  );


  button.disabled=true;

  result.classList.remove(
    "show"
  );

  machine.classList.add(
    "shake"
  );


  slot1.classList.add("spin");
  slot2.classList.add("spin");
  slot3.classList.add("spin");


  let timer=
  setInterval(function(){

    slot1.innerText=
    randomIcon();

    slot2.innerText=
    randomIcon();

    slot3.innerText=
    randomIcon();

  },80);


  setTimeout(function(){

    clearInterval(timer);

    slot1.classList.remove("spin");
    slot2.classList.remove("spin");
    slot3.classList.remove("spin");

    slot1.innerText=
    randomIcon();

    slot2.innerText=
    randomIcon();

    slot3.innerText=
    randomIcon();


    count++;

    document
    .getElementById("count")
    .innerText=count;


    const prize=
    prizes[
      Math.floor(
        Math.random()*
        prizes.length
      )
    ];


    result.innerText=
    prize;


    result.classList.add(
      "show"
    );


    createHearts(12);


    machine.classList.remove(
      "shake"
    );


    spinning=false;

    button.disabled=false;


    /* بعد 5 مفاجآت */

    if(count>=5){

      setTimeout(function(){

        showFinal();

      },2200);

    }

  },1800);

}


/* رمز عشوائي */

function randomIcon(){

  return icons[
    Math.floor(
      Math.random()*
      icons.length
    )
  ];

}


/* قلوب */

function createHearts(amount){

  for(
    let i=0;
    i<amount;
    i++
  ){

    setTimeout(function(){

      const heart=
      document.createElement(
        "div"
      );

      heart.className=
      "heart";

      heart.innerText=
      [
        "❤️",
        "💖",
        "💕",
        "💗"
      ][
        Math.floor(
          Math.random()*4
        )
      ];

      heart.style.left=
      Math.random()*100+"vw";

      heart.style.fontSize=
      (
        18+
        Math.random()*28
      )+"px";

      heart.style.animationDuration=
      (
        3+
        Math.random()*4
      )+"s";


      document.body.appendChild(
        heart
      );


      setTimeout(function(){

        heart.remove();

      },8000);

    },i*60);

  }

}


/* النهاية */

function showFinal(){

  document
  .getElementById("final")
  .classList
  .add("show");

  createHearts(80);

}


/* إغلاق النهاية */

function closeFinal(){

  document
  .getElementById("final")
  .classList
  .remove("show");

  createHearts(40);

}

</script>

</body>
</html>
